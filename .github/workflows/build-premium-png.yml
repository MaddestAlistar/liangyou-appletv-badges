name: Build premium PNG badges
on:
  push:
    branches: [main]
    paths:
      - 'badges-premium-svg/**'
      - '.github/workflows/build-premium-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - name: Render native PNG files
        run: |
          mkdir -p badges-premium-png
          for f in badges-premium-svg/*.svg; do
            name="$(basename "$f" .svg)"
            rsvg-convert -w 1080 -h 324 "$f" -o "badges-premium-png/$name.png"
          done
      - name: Commit PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges-premium-png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render premium native PNG badges"
            git push
          fi
