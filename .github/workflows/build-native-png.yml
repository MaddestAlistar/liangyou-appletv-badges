name: Build native PNG badges

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PNG badges
        shell: bash
        run: |
          python -m pip install cairosvg
          mkdir -p badges-png-native
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for p in Path("badges-lite-svg").glob("*.svg"):
              cairosvg.svg2png(
                  url=str(p),
                  write_to=str(Path("badges-png-native") / (p.stem + ".png")),
                  output_width=960,
                  output_height=320
              )
          PY

      - name: Point JSON to direct GitHub PNGs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          p = Path("badges-png.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          base = "https://raw.githubusercontent.com/MaddestAlistar/liangyou-appletv-badges/main/badges-png-native"
          for item in data.get("filters", []):
              u = urllib.parse.unquote(item.get("imageURL", ""))
              m = re.search(r"/([^/?]+)\.(?:svg|png)", u)
              if m:
                  item["imageURL"] = base + "/" + m.group(1) + ".png"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          t = p.read_text(encoding="utf-8") if p.exists() else "# 良友科技学院 · Apple TV Badges\n"
          marker = "## PNG 原生直链兼容版"
          note = """## PNG 原生直链兼容版
- `badges-png.json` 使用 GitHub Raw 原生 PNG 直链，不再经过第三方图片代理。
- 适配 **EplayerX / Forward / Nuvio / RovePlayer**。
- EplayerX 如无法显示代理图片或 SVG，优先使用这一版。
"""
          if marker in t:
              t = t.split(marker)[0].rstrip() + "\n\n" + note
          else:
              t = t.rstrip() + "\n\n" + note
          p.write_text(t, encoding="utf-8")
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges-png-native badges-png.json README.md
          git diff --cached --quiet && exit 0
          git commit -m "Use native PNG badge files for EplayerX"
          git push
